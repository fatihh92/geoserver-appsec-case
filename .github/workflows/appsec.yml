name: AppSec - CodeQL and Trivy

on:
  push:
    branches: [appsec/geoserver-2.25.1]
  pull_request:
    branches: [appsec/geoserver-2.25.1]
  workflow_dispatch:
  # Runs on the default branch. Set the case branch as default to enable this.
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: appsec-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record analyzed source
        run: |
          mkdir -p reports/codeql
          git rev-parse HEAD > reports/source-commit.txt
          python3 -m unittest discover -s security/tests -v
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Initialize CodeQL (source analysis without build)
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: java-kotlin
          build-mode: none
          queries: security-extended
      - name: Analyze Java source
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          output: reports/codeql
          upload: never
          upload-database: false
          category: appsec-codeql-java
      - name: Upload CodeQL results to Security tab
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: reports/codeql
          category: appsec-codeql-java
      - name: Enforce SAST policy
        run: python3 security/gate.py codeql reports/codeql
      - name: Preserve CodeQL evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: error
          retention-days: 30

  trivy:
    name: Trivy SCA
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record analyzed source
        run: |
          mkdir -p reports
          git rev-parse HEAD > reports/source-commit.txt
      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1
          cache: false
      - name: Scan dependency manifests (all severities, no ignore list)
        run: |
          trivy version > reports/trivy-version.txt
          trivy fs --scanners vuln --pkg-types library --list-all-pkgs \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --ignore-unfixed=false --ignorefile '' \
            --format json --output reports/trivy.json --exit-code 0 \
            --timeout 25m src 2> >(tee reports/trivy.log >&2)
      - name: Generate SARIF and dependency inventory from the same scan
        run: |
          trivy convert --format sarif --output reports/trivy.sarif reports/trivy.json
          trivy convert --format cyclonedx --output reports/sbom.cdx.json reports/trivy.json
      - name: Upload Trivy results to Security tab
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: reports/trivy.sarif
          category: appsec-trivy-maven
      - name: Enforce SCA policy
        run: python3 security/gate.py trivy reports/trivy.json
      - name: Preserve Trivy evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: error
          retention-days: 30

  security-gate:
    name: Security gate
    if: always()
    needs: [codeql, trivy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require both scans and policies to succeed
        env:
          CODEQL_RESULT: ${{ needs.codeql.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
        run: |
          printf 'CodeQL: %s\nTrivy: %s\n' "$CODEQL_RESULT" "$TRIVY_RESULT"
          test "$CODEQL_RESULT" = success
          test "$TRIVY_RESULT" = success
