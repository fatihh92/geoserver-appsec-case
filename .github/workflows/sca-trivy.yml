name: SCA - Trivy

on:
  push:
    branches: [appsec/geoserver-2.25.1]
  pull_request:
    branches: [appsec/geoserver-2.25.1]
  workflow_dispatch:
    inputs:
      mode:
        description: 'enforce: fail on HIGH/CRITICAL; report-only: report findings'
        type: choice
        required: true
        default: enforce
        options:
          - enforce
          - report-only
  # Runs on the default branch. Set the case branch as default to enable this.
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

env:
  SCAN_MODE: ${{ inputs.mode || 'enforce' }}

concurrency:
  group: appsec-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

run-name: "SCA - Trivy / ${{ inputs.mode || 'enforce' }} / ${{ github.ref_name }}"

jobs:
  trivy:
    name: Trivy SCA
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record analyzed source
        run: |
          mkdir -p reports
          git rev-parse HEAD > reports/source-commit.txt
      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1
          cache: false
      - name: Scan dependency manifests (all severities, no ignore list)
        run: |
          trivy version > reports/trivy-version.txt
          trivy fs --config security/trivy.yaml --scanners vuln --pkg-types library --list-all-pkgs \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --ignore-unfixed=false --ignorefile '' \
            --format json --output reports/trivy.json --exit-code 0 \
            --timeout 25m src 2> >(tee reports/trivy.log >&2)
      - name: Generate SARIF and dependency inventory from the same scan
        run: |
          trivy convert --format sarif --output reports/trivy.sarif reports/trivy.json
          trivy convert --format cyclonedx --output reports/sbom.cdx.json reports/trivy.json
      - name: Upload Trivy results to Security tab
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: reports/trivy.sarif
          category: appsec-trivy-maven
      - name: Evaluate SCA results in selected mode
        run: python3 security/gate.py trivy reports/trivy.json --mode "$SCAN_MODE"
      - name: Preserve Trivy evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-${{ env.SCAN_MODE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: error
          retention-days: 30
